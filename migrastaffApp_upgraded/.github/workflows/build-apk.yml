name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          VERSION_RAW=$(java -version 2>&1 | head -n 1 | sed -n 's/.*"\([^"]*\)".*/\1/p')
          if [ -z "$VERSION_RAW" ]; then
            echo "::error::Failed to detect active Java version."
            exit 1
          fi

          if [[ "$VERSION_RAW" == 1.* ]]; then
            MAJOR=$(echo "$VERSION_RAW" | cut -d. -f2)
          else
            MAJOR=$(echo "$VERSION_RAW" | cut -d. -f1)
          fi

          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to determine active Java major version from: $VERSION_RAW"
            exit 1
          fi

          echo "Detected active Java major version: $MAJOR"
          if [ "$MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:-}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            KEYTOOL_BIN="$(command -v keytool || true)"
          fi

          if [ -z "$KEYTOOL_BIN" ]; then
            echo "::error::keytool was not found in the configured Java 17 installation."
            exit 1
          fi

          if [ -f "./debug.keystore" ]; then
            echo "Found existing ./debug.keystore; skipping generation."
          else
            "$KEYTOOL_BIN" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to create temporary ./debug.keystore."
            exit 1
          fi
          echo "Temporary ./debug.keystore verified."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have the .apk extension."
            exit 1
          fi

          APK_BYTES=$(wc -c < "$EXPECTED_APK" | tr -d ' ')
          echo "Verified debug APK: $EXPECTED_APK ($APK_BYTES bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK missing at $SOURCE_APK"
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-|-$//g')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi

          RELEASE_ASSET_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_NAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Failed to prepare valid release APK at $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release APK asset is missing or invalid."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes-XXXXXX.md")
          cat <<EOF > "$NOTES_FILE"
          Automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Intended Purpose:** Testing only (not a Google Play Store production release)
          - **Signing:** Signed only with a temporary debug keystore
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "$RELEASE_TAG" --json tagName,name,url,assets
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            CONFIRMED_ASSET=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[0].name // ""')
            if [ -z "$CONFIRMED_ASSET" ]; then
              CONFIRMED_ASSET="${ASSET_NAME}"
            fi

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "Release Asset Filename: ${CONFIRMED_ASSET}"

            {
              echo "### Debug APK Build & Release Summary"
              echo "- **Status:** Debug APK build, Actions artifact upload, and GitHub Release publishing succeeded."
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Direct GitHub Release URL:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${CONFIRMED_ASSET}\`"
              echo "- **Download Instructions:** Download \`${CONFIRMED_ASSET}\` directly from the **Assets** section on the GitHub Release page above."
              echo "- **Backup Artifact:** The GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Summary (Release Warning)"
              echo "- **Warning:** GitHub Release publishing failed for tag \`${RELEASE_TAG}\`."
              echo "- **Build Status:** The debug APK build succeeded cleanly."
              echo "- **Backup Artifact:** Download the APK from the GitHub Actions artifact named \`app-debug-apk\` attached to this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
