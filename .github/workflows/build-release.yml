name: Build Signed Release APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "USING_SECRET=true" >> "$GITHUB_ENV"
          else
            PASS="MigraPro2026ReleaseKey!"
            keytool -genkeypair -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass "$PASS" -keypass "$PASS" -dname "CN=MigraStaff, OU=Mobile, O=OOO MigraStaff, L=Moscow, C=RU"
            echo "STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "USING_SECRET=false" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build Signed Release APK and AAB
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Upload Release APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-and-aab
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Backup Keystore Artifact
        if: env.USING_SECRET == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: my-upload-key.jks

      - name: Publish Signed Release APK & AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$APK" "MigraStaff-v1.6-release.apk"
          cp "$AAB" "MigraStaff-v1.6-release.aab"
          TAG="release-v1.6-b${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "MigraStaff-v1.6-release.apk" "MigraStaff-v1.6-release.aab" \
            --title "MigraStaff v1.6 Signed Release (APK + AAB)" \
            --notes "Signed Release APK (RuStore / Direct) and AAB (Google Play Store)." \
            --latest
